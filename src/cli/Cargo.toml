[package]
name = "dotapps-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dotapps"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
tar = "0.4"
tempfile = "3"
url = "2"
zstd = "0.13"

[lints]
workspace = true
