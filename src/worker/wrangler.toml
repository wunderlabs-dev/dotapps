name = "dotapps-registry"
main = "src/index.ts"
compatibility_date = "2024-09-25"
account_id = "9314014021a0127a3f9bed9b4f77be3a"

# Served from both the workers.dev subdomain (always reachable) and the
# branded custom domain (resolves once dotapps.club NS finishes propagating).
workers_dev = true

[[routes]]
pattern = "registry.dotapps.club"
custom_domain = true

# Cloudflare R2 bucket holding published .apps artifacts, their manifests,
# and the per-app `latest` version pointers.
# Provisioned manually: `wrangler r2 bucket create dotapps-registry`.
[[r2_buckets]]
binding = "REGISTRY"
bucket_name = "dotapps-registry"

# Secrets (set via `wrangler secret put`):
# PUBLISH_TOKEN - Bearer token required on publish endpoints and fallback blob PUT
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / ACCOUNT_ID - optional; when all
#   three are present the Worker hands out presigned R2 URLs for blob
#   upload/download instead of proxying bytes through /v1/blob/* itself
