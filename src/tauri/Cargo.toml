[package]
name = "opnble"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opnble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
git2 = "0.18"
keyring = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

# MCP server: rmcp provides ServerHandler + tool macros; the streamable HTTP
# transport plugs into axum so a tower-friendly bearer middleware can sit in
# front of `/mcp`. `schemars` generates JSON schemas for tool argument types;
# `getrandom` seeds the auth token used by editor / MCP clients on localhost.
rmcp = { version = "1.7", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
schemars = "1"
axum = "0.8"
getrandom = "0.3"
rand = "0.8"
base64 = "0.22"
shlex = "1.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
libc = "0.2"
ttrpc = { version = "0.9", features = ["async"] }
opnble-agent = { path = "../agent", default-features = false }
protobuf = "3"
notify = "7"

[target.'cfg(target_os = "linux")'.dependencies]
bollard = "0.16"
futures = "0.3"

# SSH is only needed for Intel Mac (QEMU fallback) and Windows (QEMU fallback)
[target.'cfg(any(all(target_os = "macos", target_arch = "x86_64"), target_os = "windows"))'.dependencies]
ssh2 = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"
mockito = "1"
# `ServiceExt::oneshot` for axum router smoke tests in `mcp::auth`.
tower = "0.5"

[lints]
workspace = true

